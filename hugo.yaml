baseURL: "https://narmzey.art/"
title: "NarmZeys Art Portfolio"
languageCode: "en-US"

theme: "hugo-swipefolio"
themesDir: "themes"

# Sidebar menu. Entries that point at a section list that section's pages
# underneath; the order of pages inside a section follows their `weight`.
menus:
  main:
    - name: "About"
      weight: 1
      pageRef: "/"
    - name: "Photography"
      weight: 2
      pageRef: "/photography/"
    - name: "Shorts"
      weight: 3
      pageRef: "/shorts/"
    - name: "Moving Images"
      weight: 4
      pageRef: "/moving-images/"

params:
  description: "Narmin Zey — interdisciplinary artist and visual storyteller. Photography, shorts and moving images."
  author:
    name: Narmin Zey
    email: narmzey@gmail.com
  profile:
    avatarUrl: "/author/avatar.jpg"
    about: "Narmin Zey is an interdisciplinary artist and visual storyteller from Azerbaijan, currently based in Weimar, Germany. She is pursuing her Masters in Media Architecture at Bauhaus University, where her work explores the intersections of space, narrative, and visual expression."
    social:
      linkedin: "narminzey"
      instagram: "narminzey"
